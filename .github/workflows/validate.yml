name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build runtimes
        env:
          CAPTURE_CODESIGN_IDENTITY: "-"
        run: npm run build:bundle
      - name: Check CLI entry points
        run: |
          packages/capture/dist/capture --help
          node packages/transcribe/dist/index.js --help
          packages/live/dist/live --help
      - name: Validate scripts and formula
        run: |
          brew install shellcheck actionlint
          shellcheck scripts/record scripts/*.sh plugins/record/scripts/*.sh packages/*/scripts/*.sh
          actionlint
          ruby -c Formula/record.rb
